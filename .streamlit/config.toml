# Run locally, the dashboard is reachable from this PC only: data/ may hold raw videos with personal
# data (Ley 1581 de 2012). Uploads are anonymized before analysis (app/dashboard.py), which is what
# makes the Streamlit Community Cloud deployment possible (README, "Publicar en Streamlit...").
[server]
address = "localhost"
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "dark"  # the animated background is dark
